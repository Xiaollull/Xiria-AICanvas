name: Cross-platform verification

on:
  push:
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Every step here is a syntax, unit, or build check; the whole job is minutes of work.
    # A cap keeps a wedged child process from billing the six-hour default, which is how
    # the Windows job burned a run before the Node test timeout was in place.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.21.0
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run setup:cli -- --diagnose --source=official --torch=cpu
      - name: Run fast Node checks
        id: node_tests
        shell: bash
        env:
          # Browser fixtures require a runner-installed browser and stay enabled by default locally.
          XIRAI_SKIP_BROWSER_FIXTURES: "1"
        run: |
          set -o pipefail
          npm run test:setup 2>&1 | tee node-tests.tap

      # A failing run reports 700-odd TAP results, and the name and reason of the handful that
      # failed are the only part worth reading. Lifting them onto the run summary means a
      # cross-platform failure is legible without paging through the raw log.
      - name: Report failing Node tests
        if: always() && steps.node_tests.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Failing Node tests on ${{ matrix.os }}"
            echo
            echo '```'
            grep -E "^# (tests|pass|fail|cancelled|skipped) " node-tests.tap || true
            echo
            # Each failure is a TAP block that opens with `not ok` and closes with `...`, so the
            # whole block is printed: a multi-line assertion diff is the useful part of it.
            awk '/^not ok /{inside=1} inside{print} inside&&/^  \.\.\.$/{inside=0}' node-tests.tap | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: node --check vite.config.js
      - run: node --check scripts/setup.mjs
      - run: node --check scripts/python.mjs
      - run: node --check scripts/run-inference.mjs
      - run: node --check scripts/node-tools.mjs
      - run: node --check scripts/nvidia.mjs
      - run: node --check scripts/proxy-policy.mjs
      - run: node --check scripts/setup-options.mjs
      - run: node --check scripts/setup-gui.mjs
      - run: node --check scripts/setup-state.mjs
      - run: node --check scripts/start.mjs
      - run: node --check scripts/torch.mjs
      - run: python -m py_compile backend/inference_server.py
      - run: python -m py_compile backend/memory_policy.py
      - run: npm run build
