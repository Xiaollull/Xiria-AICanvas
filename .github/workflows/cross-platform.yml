name: Cross-platform verification

on:
  push:
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: npm ci
      - run: npm run setup:cli -- --diagnose --source=official --torch=cpu
      - run: npm run test:setup

      - name: Create isolated project Python environment
        run: python -m venv .venv

      - name: Use project virtual environment on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:GITHUB_WORKSPACE ".venv\Scripts")

      - name: Use project virtual environment on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install CPU-only backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install --upgrade --upgrade-strategy only-if-needed -r backend/requirements.txt
          python -m pip check
          python -c "import torch, torchvision; from PIL import Image; print(f'CPU PyTorch {torch.__version__}; torchvision {torchvision.__version__}')"

      - run: node -e "import('./scripts/python.mjs').then(({verifyProjectVenv}) => { const result = verifyProjectVenv(process.cwd()); if (!result.ok) throw new Error(result.error); })"
      - run: node --check vite.config.js
      - run: node --check scripts/setup.mjs
      - run: node --check scripts/python.mjs
      - run: node --check scripts/run-inference.mjs
      - run: node --check scripts/node-tools.mjs
      - run: node --check scripts/nvidia.mjs
      - run: node --check scripts/setup-options.mjs
      - run: node --check scripts/setup-gui.mjs
      - run: node --check scripts/setup-state.mjs
      - run: node --check scripts/start.mjs
      - run: node --check scripts/torch.mjs
      - run: python -m py_compile backend/inference_server.py
      - run: python -m py_compile backend/memory_policy.py
      - run: npm run test:backend
      - run: npm run build
